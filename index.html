<!DOCTYPE html>
<html lang="pt-BR" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeoChat</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'app-bg': 'var(--app-bg)', 'app-panel': 'var(--app-panel)',
                        'app-input': 'var(--app-input)', 'app-accent': 'var(--app-accent)',
                        'app-accent-hover': 'var(--app-accent)', 'app-text': 'var(--app-text)',
                        'app-text-muted': 'var(--app-text-muted)', 'app-border': 'var(--app-border)',
                        'app-message-me': 'var(--app-accent)', 'app-message-other': 'var(--app-input)'
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <style>
        :root, [data-theme="default"] {
            --app-bg: #0f172a; --app-panel: #1e293b; --app-input: #334155; 
            --app-accent: #3b82f6; --app-text: #f8fafc;
            --app-text-muted: #94a3b8; --app-border: #334155;
        }
        [data-theme="dracula"] {
            --app-bg: #282a36; --app-panel: #44475a; --app-input: #6272a4;
            --app-accent: #bd93f9; --app-text: #f8f8f2;
            --app-text-muted: #8be9fd; --app-border: #6272a4;
        }
        [data-theme="light"] {
            --app-bg: #f3f4f6; --app-panel: #ffffff; --app-input: #e5e7eb;
            --app-accent: #10b981; --app-text: #1f2937;
            --app-text-muted: #6b7280; --app-border: #d1d5db;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .message-enter { animation: slideIn 0.2s ease-out forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        audio { height: 35px; outline: none; }
        audio::-webkit-media-controls-panel { background-color: rgba(255, 255, 255, 0.8); }
    </style>
</head>
<body class="bg-app-bg text-app-text h-screen flex overflow-hidden font-sans transition-colors duration-300">

    <!-- Tela de Login & Customização -->
    <div id="login-screen" class="fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-app-panel p-6 rounded-2xl w-full max-w-lg border border-app-border max-h-[95vh] overflow-y-auto no-scrollbar shadow-2xl">
            <h1 class="text-4xl font-black text-center text-app-accent mb-1 tracking-tighter" style="color: var(--app-accent)">GeoChat</h1>
            <p class="text-center text-app-text-muted text-sm mb-6">Conecte-se com o mundo ao seu redor</p>
            
            <div class="flex flex-col items-center mb-6">
                <div class="relative w-32 h-32 rounded-full bg-app-input overflow-hidden border-4 shadow-lg flex items-center justify-center mb-4 transition-transform hover:scale-105" style="border-color: var(--app-accent)">
                    <img id="avatar-preview" src="" class="w-full h-full object-cover">
                </div>
                <div class="flex gap-2 w-full justify-center">
                    <button onclick="randomizeAvatar()" class="bg-app-input hover:bg-app-bg text-app-text text-xs px-4 py-2 rounded-lg transition font-bold">🎲 Sortear</button>
                    <label class="bg-app-input hover:bg-app-bg text-app-text text-xs px-4 py-2 rounded-lg transition font-bold cursor-pointer flex items-center">
                        💻 Enviar Foto
                        <input type="file" accept="image/*" class="hidden" onchange="handleProfilePhotoUpload(event)">
                    </label>
                </div>
            </div>

            <div class="bg-app-bg p-4 rounded-xl border border-app-border mb-6">

                <div class="grid grid-cols-2 gap-2 md:gap-3">

                        <option value="">Pele: Padrão</option><option value="ffdbb4">Pálida</option><option value="f8d25c">Amarela</option><option value="edb98a">Clara</option><option value="d08b5b">Parda</option><option value="ae5d29">Morena</option><option value="614335">Escura</option>
                    </select>
                    <select id="av-top" onchange="updateCustomAvatar()" class="bg-app-input rounded p-1.5 text-xs text-app-text outline-none">
                        <option value="shortFlat">Cabelo: Curto</option><option value="shortCurly">Cacheado</option><option value="shortWaved">Ondulado Curto</option><option value="longButNotTooLong">Longo</option><option value="straight02">Liso</option><option value="dreads">Dreads</option><option value="dreads02">Dreads Longos</option><option value="bald">Careca</option><option value="hat">Chapéu</option><option value="turban">Turbante</option><option value="winterHat1">Gorro</option>
                    </select>
                    <select id="av-hair-color" onchange="updateCustomAvatar()" class="bg-app-input rounded p-1.5 text-xs text-app-text outline-none">
                        <option value="2c1b18">Cor Cabelo: Preto</option><option value="4a3123">Castanho</option><option value="d6b370">Loiro</option><option value="a55728">Ruivo</option><option value="fc909f">Rosa</option><option value="b58143">Loiro Escuro</option><option value="724133">Mogno</option><option value="e8e1e1">Platinado</option>
                    </select>
                    <select id="av-clothes" onchange="updateCustomAvatar()" class="bg-app-input rounded p-1.5 text-xs text-app-text outline-none">
                        <option value="hoodie">Roupa: Moletom</option><option value="shirtCrewNeck">Camiseta Gola Redonda</option><option value="shirtVNeck">Camiseta Gola V</option><option value="graphicShirt">Camiseta Estampada</option><option value="blazerAndShirt">Blazer e Camisa</option><option value="blazerAndSweater">Blazer e Suéter</option><option value="overall">Macacão</option>
                    </select>
                    <select id="av-facial-hair" onchange="updateCustomAvatar()" class="bg-app-input rounded p-1.5 text-xs text-app-text outline-none">

                    </select>
                    <select id="av-facial-hair-color" onchange="updateCustomAvatar()" class="bg-app-input rounded p-1.5 text-xs text-app-text outline-none">
                        <option value="2c1b18">Cor Barba: Preto</option><option value="4a3123">Castanho</option><option value="d6b370">Loiro</option><option value="a55728">Ruivo</option><option value="e8e1e1">Grisalho</option>
                    </select>
                    <select id="av-eyes" onchange="updateCustomAvatar()" class="bg-app-input rounded p-1.5 text-xs text-app-text outline-none col-span-2">
                        <option value="">Óculos: Nenhum</option><option value="prescription01">De Grau Fino</option><option value="prescription02">De Grau Grosso</option><option value="round">Redondos</option><option value="sunglasses">Escuros</option><option value="wayfarers">Wayfarer</option>
                    </select>

            <div class="space-y-3 mb-6">
                <input type="text" id="username" placeholder="Seu apelido..." class="w-full bg-app-input border border-app-border rounded-xl px-4 py-3 text-app-text focus:outline-none font-bold" style="border-color: var(--app-border); outline-color: var(--app-accent);" onkeypress="if(event.key === 'Enter') startApp()">
                <input type="text" id="userstatus" placeholder="Seu recado (ex: Ocupado, Feliz...)" class="w-full bg-app-input border border-app-border rounded-xl px-4 py-2 text-app-text text-sm focus:outline-none" style="border-color: var(--app-border); outline-color: var(--app-accent);" onkeypress="if(event.key === 'Enter') startApp()">

            <p id="login-status" class="text-sm text-center mt-4 font-bold hidden animate-pulse" style="color: var(--app-accent)">Sincronizando...</p>

    <!-- App Principal -->

                <div class="flex gap-2 shrink-0">

                    <button onclick="openGroupModal()" class="w-10 h-10 rounded-full bg-app-input hover:brightness-110 transition flex items-center justify-center text-lg" style="color: var(--app-accent)" title="Novo Grupo">➕</button>

            </div>

                    <button onclick="document.getElementById('file-input').click()" class="p-2 text-app-text-muted hover:text-white transition rounded-full hover:bg-app-panel" title="Anexar Arquivo">📎</button>
                    <input type="file" id="file-input" class="hidden" onchange="sendFile(this)">
                    
                    <button onclick="openDrawingModal()" class="p-2 text-app-text-muted hover:text-white transition rounded-full hover:bg-app-panel" title="Desenhar">🎨</button>
                    <button onclick="sendLocation()" class="p-2 text-app-text-muted hover:text-white transition rounded-full hover:bg-app-panel" title="Enviar Localização">📍</button>

            </div>
        </div>

            <div class="flex items-center justify-between p-3 bg-app-bg border-b border-app-border">
                <h3 class="font-bold text-app-text">Quadro de Desenho</h3>
                <button onclick="closeDrawingModal()" class="text-[#ef4444] font-bold px-3 py-1 bg-app-input rounded-lg hover:bg-red-900/30">✕</button>
            </div>
            <div class="flex-1 bg-white relative">
                <canvas id="draw-canvas" class="absolute inset-0 w-full h-full cursor-crosshair touch-none"></canvas>
            </div>
            <div class="p-3 bg-app-bg border-t border-app-border flex gap-3 justify-between items-center">
                <div class="flex items-center gap-3">
                    <input type="color" id="draw-color" value="#3b82f6" class="w-10 h-10 rounded cursor-pointer border-0 bg-transparent">
                    <input type="range" id="draw-size" min="1" max="20" value="3" class="w-24 accent-blue-500">
                </div>
                <div class="flex gap-2">
                    <button onclick="clearCanvas()" class="px-4 py-2 bg-app-input text-app-text hover:bg-app-border rounded-lg text-sm font-bold transition">Limpar</button>

    <!-- Configurações -->

        <div class="bg-app-panel p-6 rounded-2xl w-full max-w-md border border-app-border shadow-2xl">
            <div class="flex justify-between items-center mb-6 border-b border-app-border pb-3">
                <h3 class="text-xl font-bold text-app-text">Configurações</h3>
                <button onclick="closeSettingsModal()" class="text-app-text-muted hover:text-red-500 font-bold text-xl">✕</button>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="text-xs text-app-text-muted uppercase font-bold mb-2 block">Tema do App</label>
                    <div class="grid grid-cols-3 gap-2">

                        <button onclick="changeAppTheme('dracula')" class="bg-[#282a36] text-[#f8f8f2] border border-[#6272a4] rounded p-2 text-xs hover:border-purple-500">Dracula</button>
                        <button onclick="changeAppTheme('light')" class="bg-[#f3f4f6] text-black border border-[#d1d5db] rounded p-2 text-xs hover:border-green-500">Claro</button>
                    </div>
                </div>
                <div>
                    <label class="text-xs text-app-text-muted uppercase font-bold mb-2 block">Cor de Destaque</label>
                    <div class="flex gap-2 justify-between">
                        <button onclick="changeAccentColor('#3b82f6')" class="w-8 h-8 rounded-full bg-[#3b82f6] border-2 border-transparent focus:border-white"></button>
                        <button onclick="changeAccentColor('#10b981')" class="w-8 h-8 rounded-full bg-[#10b981] border-2 border-transparent focus:border-white"></button>
                        <button onclick="changeAccentColor('#8b5cf6')" class="w-8 h-8 rounded-full bg-[#8b5cf6] border-2 border-transparent focus:border-white"></button>
                        <button onclick="changeAccentColor('#ef4444')" class="w-8 h-8 rounded-full bg-[#ef4444] border-2 border-transparent focus:border-white"></button>
                        <button onclick="changeAccentColor('#f59e0b')" class="w-8 h-8 rounded-full bg-[#f59e0b] border-2 border-transparent focus:border-white"></button>
                        <button onclick="changeAccentColor('#ec4899')" class="w-8 h-8 rounded-full bg-[#ec4899] border-2 border-transparent focus:border-white"></button>

                </div>
                <div>
                    <label class="text-xs text-app-text-muted uppercase font-bold mb-2 block">Atualizar Perfil</label>
                    <input type="text" id="settings-name" placeholder="Novo nome..." class="w-full bg-app-input border border-app-border rounded-lg px-3 py-2 text-app-text mb-2 text-sm focus:outline-none">
                    <input type="text" id="settings-status" placeholder="Novo status..." class="w-full bg-app-input border border-app-border rounded-lg px-3 py-2 text-app-text text-sm focus:outline-none">

    <!-- Navegador Bing -->
    <div id="browser-modal" class="fixed inset-0 bg-black/90 z-50 flex flex-col p-2 md:p-6 backdrop-blur-sm" style="display: none;">
        <div class="bg-app-panel rounded-xl w-full h-full flex flex-col shadow-2xl border border-app-border overflow-hidden">
            <div class="flex items-center justify-between p-2 bg-app-bg border-b border-app-border gap-2">
                <div class="flex-1 flex items-center bg-app-input rounded-lg px-3 py-1.5 border border-app-border">
                    <span class="text-xs mr-2 opacity-50">URL:</span>
                    <input type="text" id="browser-url-input" placeholder="Pesquisar ou digitar URL..." class="w-full bg-transparent text-sm text-app-text focus:outline-none" onkeypress="if(event.key === 'Enter') navigateBrowser()">
                </div>
                <button onclick="navigateBrowser()" class="px-4 py-1.5 rounded-lg text-white font-bold text-sm" style="background-color: var(--app-accent)">Ir</button>
                <button onclick="closeBrowserModal()" class="text-[#ef4444] font-bold px-3 py-1.5 bg-app-input rounded-lg hover:bg-red-900/30">✕</button>
            </div>
            <div class="flex-1 relative bg-white">
                <iframe id="browser-frame" src="https://www.bing.com/" class="w-full h-full border-0"></iframe>
            </div>
        </div>
    </div>

    <!-- Grupos -->
    <div id="group-modal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4" style="display: none;">
        <div class="bg-app-panel p-6 rounded-2xl w-full max-w-md border border-app-border">
            <h3 class="text-xl font-bold text-app-text mb-4">Criar Novo Grupo</h3>
            <input type="text" id="group-name-input" placeholder="Nome do Grupo" class="w-full bg-app-input border border-app-border rounded-lg px-4 py-3 text-app-text focus:outline-none mb-4">
            <div id="group-members-list" class="max-h-48 overflow-y-auto space-y-1 mb-4 bg-app-bg p-2 rounded-lg border border-app-border"></div>
            <div class="flex gap-2">
                <button onclick="document.getElementById('group-modal').style.display='none'" class="flex-1 bg-app-input py-2.5 rounded-lg text-app-text">Cancelar</button>
                <button onclick="createGroup()" class="flex-1 text-white font-bold py-2.5 rounded-lg" style="background-color: var(--app-accent)">Criar</button>
            </div>
        </div>
    </div>

    <script>
        const BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';
        const APP_TOPIC = 'geochat_super_v10_pro'; 
        const MAX_PAYLOAD = 10 * 1024 * 1024; // 10MB para testes com imagens mais pesadas

        let client;
        let myProfile = { id: 'u_' + Math.random().toString(36).substr(2, 9), name: '', status: '', avatar: '', lastSeen: Date.now() };
        let users = new Map(); 
        let groups = {}; 
        let chats = {}; 
        let activeChatId = null; 
        let currentSeed = Math.random().toString(36).substring(7);
        let typingTimeout;

        // Váriaveis Persistentes de Áudio e Localização
        let globalAudioStream = null;
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        
        let globalLocationWatcher = null;
        let lastKnownLocation = null;

        // --- SISTEMA DE DESENHO ---
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function resizeCanvas() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; }
        function startDrawing(e) { isDrawing = true; draw(e); }
        function stopDrawing() { isDrawing = false; ctx.beginPath(); }
        
        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            
            ctx.lineWidth = document.getElementById('draw-size').value;
            ctx.lineCap = 'round';
            ctx.strokeStyle = document.getElementById('draw-color').value;
            
            ctx.lineTo(x, y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', e => { e.preventDefault(); draw(e); });
        canvas.addEventListener('touchend', stopDrawing);

        function openDrawingModal() { document.getElementById('drawing-modal').style.display = 'flex'; setTimeout(resizeCanvas, 100); }
        function closeDrawingModal() { document.getElementById('drawing-modal').style.display = 'none'; }
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        
        function sendDrawing() {
            const data = canvas.toDataURL('image/png');
            sendPayload('image', data);
            closeDrawingModal();
            clearCanvas();
        }
        // --------------------------

        // ÁUDIO PERSISTENTE
        async function toggleRecording() {
            const btn = document.getElementById('record-btn');
            const input = document.getElementById('message-input');
            
            if (!isRecording) {
                try {
                    // Mantém a permissão salva na aba para não perguntar de novo
                    if (!globalAudioStream) {
                        input.placeholder = "Solicitando microfone...";
                        globalAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    }
                    
                    mediaRecorder = new MediaRecorder(globalAudioStream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            if (e.target.result.length > MAX_PAYLOAD) alert("Áudio muito longo! Gravação excedeu 10MB.");
                            else sendPayload('audio', e.target.result);
                        };
                        reader.readAsDataURL(audioBlob);
                    };
                    
                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('text-red-500', 'animate-pulse');
                    input.placeholder = "Gravando áudio... (Clique no mic para parar)";
                } catch (err) {
                    alert('Erro ao acessar o microfone. Verifique as permissões.');
                    input.placeholder = "Digite uma mensagem...";
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('text-red-500', 'animate-pulse');
                input.placeholder = "Digite uma mensagem...";
            }
        }

        // LOCALIZAÇÃO PERSISTENTE
        function sendLocation() {
            if (!navigator.geolocation) return alert('Geolocalização não suportada.');
            const input = document.getElementById('message-input');
            const originalPh = input.placeholder;

            // Se já temos a localização recente, envia imediatamente sem carregar
            if (lastKnownLocation) {
                sendPayload('location', lastKnownLocation);
                return;
            }

            input.placeholder = "Buscando localização pela primeira vez...";
            
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    lastKnownLocation = `${pos.coords.latitude},${pos.coords.longitude}`;
                    sendPayload('location', lastKnownLocation);
                    input.placeholder = originalPh;
                    
                    // Inicia o observador silencioso para envios futuros instantâneos
                    if (!globalLocationWatcher) {
                        globalLocationWatcher = navigator.geolocation.watchPosition(p => {
                            lastKnownLocation = `${p.coords.latitude},${p.coords.longitude}`;
                        }, null, { enableHighAccuracy: true });
                    }
                },
                (err) => {
                    alert('Erro ao obter localização. Permita o acesso no navegador.');
                    input.placeholder = originalPh;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // AVATAR E CONFIGS
        function openSettingsModal() { 
            document.getElementById('settings-name').value = myProfile.name;
            document.getElementById('settings-status').value = myProfile.status;
            document.getElementById('settings-modal').style.display = 'flex'; 
        }
        function closeSettingsModal() { document.getElementById('settings-modal').style.display = 'none'; }
        
        function changeAppTheme(theme) { document.documentElement.setAttribute('data-theme', theme); }
        function changeAccentColor(color) { document.documentElement.style.setProperty('--app-accent', color); }
        
        function saveSettings() {
            const n = document.getElementById('settings-name').value.trim();
            const s = document.getElementById('settings-status').value.trim();
            if(n) {
                myProfile.name = n;
                myProfile.status = s || myProfile.status;
                document.getElementById('my-name').innerText = myProfile.name;
                document.getElementById('my-status').innerText = myProfile.status;
                client.publish(`${APP_TOPIC}/discovery`, JSON.stringify(myProfile));
            }
            closeSettingsModal();
        }

        function randomizeAvatar() { currentSeed = Math.random().toString(36).substring(7); updateCustomAvatar(); }
        
        function updateCustomAvatar() {
            const skin = document.getElementById('av-skin').value;
            const top = document.getElementById('av-top').value;
            const hair = document.getElementById('av-hair-color').value;
            const clothes = document.getElementById('av-clothes').value;
            const beard = document.getElementById('av-facial-hair').value;
            const beardColor = document.getElementById('av-facial-hair-color').value;
            const eyes = document.getElementById('av-eyes').value;

            let url = `https://api.dicebear.com/7.x/avataaars/svg?seed=${currentSeed}&top=${top}&clothing=${clothes}&backgroundColor=transparent`;
            if(skin) url += `&skinColor=${skin}`;
            if(hair) url += `&hairColor=${hair}`;
            
            if(beard) url += `&facialHair=${beard}&facialHairProbability=100&facialHairColor=${beardColor}`;
            else url += `&facialHairProbability=0`;

            if(eyes) url += `&accessories=${eyes}&accessoriesProbability=100`;
            else url += `&accessoriesProbability=0`;

            document.getElementById('avatar-preview').src = url;
        }
        window.onload = updateCustomAvatar;

        function handleProfilePhotoUpload(e) {
            const file = e.target.files[0]; if(!file) return;
            const r = new FileReader(); r.onload = ev => document.getElementById('avatar-preview').src = ev.target.result;
            r.readAsDataURL(file);
        }

        function startApp() {
            const n = document.getElementById('username').value.trim();
            const s = document.getElementById('userstatus').value.trim();
            if (!n) return alert('Digite um apelido!');
            myProfile.name = n; myProfile.status = s || 'Disponível'; myProfile.avatar = document.getElementById('avatar-preview').src;
            
            document.getElementById('login-status').classList.remove('hidden');
            connectMQTT();
        }

        function connectMQTT() {
            client = mqtt.connect(BROKER_URL, { clientId: myProfile.id });
            client.on('connect', () => {
                client.subscribe(`${APP_TOPIC}/discovery`); 
                client.subscribe(`${APP_TOPIC}/msg/${myProfile.id}`);
                
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.opacity = '1'; 
                document.getElementById('main-app').style.pointerEvents = 'auto';
                
                document.getElementById('my-avatar').src = myProfile.avatar; 
                document.getElementById('my-name').innerText = myProfile.name;
                document.getElementById('my-status').innerText = myProfile.status;
                
                setInterval(() => { myProfile.lastSeen = Date.now(); client.publish(`${APP_TOPIC}/discovery`, JSON.stringify(myProfile)); }, 3000);
                setInterval(cleanupUsers, 5000);
            });

            client.on('message', (t, m) => { 
                try { const d = JSON.parse(m.toString()); if(t.includes('discovery')) handlePresence(d); else handleIncomingMessage(d, t); } catch(e){} 
            });
        }

        function handlePresence(u) { if (u.id === myProfile.id) return; users.set(u.id, u); updateUI(); }
        function cleanupUsers() {
            const now = Date.now(); let changed = false;
            for (let [id, u] of users.entries()) { if (now - u.lastSeen > 12000) { users.delete(id); changed = true; } }
            if (changed) updateUI();
        }

        function updateUI() {
            const listEl = document.getElementById('users-list');
            const search = document.getElementById('search-chat').value.toLowerCase();
            listEl.innerHTML = '';
            
            const renderItem = (id, data, isGroup) => {
                if(search && !data.name.toLowerCase().includes(search)) return;
                
                const msgs = chats[id] || [];
                const unread = msgs.filter(m => m.unread).length;
                const lastMsg = msgs.length > 0 ? msgs[msgs.length-1] : null;
                
                let previewText = data.status;
                if (lastMsg) {
                    if (lastMsg.type === 'text') previewText = lastMsg.content;
                    else if (lastMsg.type === 'audio') previewText = '🎤 Áudio';
                    else if (lastMsg.type === 'location') previewText = '📍 Localização';
                    else if (lastMsg.type === 'delete') previewText = '🚫 Apagada';
                    else if (lastMsg.type === 'image') previewText = '🖼️ Imagem';
                    else previewText = '📎 Arquivo';
                } else if (isGroup) {
                    previewText = 'Novo grupo';
                }
                
                const active = activeChatId === id ? 'bg-app-input border-app-accent border-l-4' : 'border-transparent hover:bg-app-input/40 border-l-4';
                const badge = unread ? `<div class="text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold shadow-lg" style="background-color: var(--app-accent)">${unread}</div>` : '';
                
                listEl.innerHTML += `
                    <div onclick="openChat('${id}', ${isGroup})" class="flex items-center p-3 rounded-xl cursor-pointer transition mb-1 ${active}">
                        <img src="${data.avatar}" class="w-12 h-12 rounded-full shrink-0 object-cover bg-app-panel">
                        <div class="ml-3 flex-1 overflow-hidden">
                            <div class="flex justify-between items-baseline w-full">
                                <h4 class="font-bold text-app-text truncate text-sm">${isGroup ? '👥 ' : ''}${data.name}</h4>
                            </div>
                            <div class="flex justify-between items-center mt-0.5">
                                <p class="text-xs text-app-text-muted truncate flex-1 mr-2">${previewText}</p>
                                ${badge}
                            </div>
                        </div>
                    </div>`;
            };

            Object.keys(groups).forEach(gId => renderItem(gId, groups[gId], true));
            users.forEach((u, id) => renderItem(id, u, false));
        }

        function openChat(id, isGroup) {
            activeChatId = id;
            if (chats[id]) chats[id].forEach(m => m.unread = false); else chats[id] = [];
            
            if (window.innerWidth < 768) {
                document.getElementById('app-sidebar').classList.add('hidden');
                document.getElementById('app-chat-area').classList.remove('hidden');
                document.getElementById('app-chat-area').classList.add('flex');
            }

            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('chat-header').style.display = 'flex';
            document.getElementById('messages-container').classList.remove('hidden');
            document.getElementById('chat-input-area').classList.remove('hidden');
            
            const data = isGroup ? groups[id] : users.get(id);
            document.getElementById('active-user-avatar').src = data.avatar;
            document.getElementById('active-user-name').innerText = data.name;
            document.getElementById('active-user-distance').innerText = isGroup ? `${data.members.length} participantes` : data.status;
            
            updateUI(); renderMessages();
        }

        function backToSidebar() {
            activeChatId = null;
            document.getElementById('app-sidebar').classList.remove('hidden');
            document.getElementById('app-chat-area').classList.add('hidden');
            document.getElementById('app-chat-area').classList.remove('flex');
            updateUI();
        }

        function sendPayload(type, content, meta = {}, isVolatile = false) {
            if (!activeChatId) return;
            const msgObj = { id: 'msg_' + Date.now(), senderId: myProfile.id, senderName: myProfile.name, time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}), type, content, ...meta };
            const payload = JSON.stringify(msgObj);
            
            if(payload.length > MAX_PAYLOAD) return alert('Arquivo excede o limite de 10MB do sistema.');

            const topic = groups[activeChatId] ? `${APP_TOPIC}/group/${activeChatId}` : `${APP_TOPIC}/msg/${activeChatId}`;
            client.publish(topic, payload);
            
            if(!isVolatile) {
                if(!chats[activeChatId]) chats[activeChatId] = [];
                chats[activeChatId].push({ ...msgObj, isMe: true });
                renderMessages(); updateUI();
            }
        }

        function sendTextMessage() {
            const i = document.getElementById('message-input');
            if (i.value.trim()) { sendPayload('text', i.value.trim()); i.value = ''; sendPayload('typing','',{isTyping:false},true); }
        }

        function handleTyping() {
            sendPayload('typing', '', { isTyping: true }, true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => sendPayload('typing', '', { isTyping: false }, true), 1500);
        }

        function handleIncomingMessage(msg, topic) {
            let targetId = msg.senderId;
            if (topic.includes('/group/')) targetId = topic.split('/').pop();
            
            if (msg.type === 'group_invite') {
                if(!groups[msg.groupData.id]) { groups[msg.groupData.id] = msg.groupData; client.subscribe(`${APP_TOPIC}/group/${msg.groupData.id}`); updateUI(); }
                return;
            }

            if (msg.senderId === myProfile.id) return; 

            if (msg.type === 'typing') {
                if (activeChatId === targetId) {
                    const ind = document.getElementById('typing-indicator');
                    if(msg.isTyping) { ind.classList.remove('hidden'); ind.querySelector('span').innerText = (msg.senderName || 'Alguém') + ' está digitando'; } 
                    else ind.classList.add('hidden');
                }
                return;
            }
            if (msg.type === 'delete') {
                const idx = chats[targetId].findIndex(m => m.id === msg.content);
                if(idx > -1) { chats[targetId][idx].type = 'deleted'; chats[targetId][idx].content = ''; if(activeChatId === targetId) renderMessages(); updateUI(); }
                return;
            }

            if (!chats[targetId]) chats[targetId] = [];
            chats[targetId].push({ ...msg, isMe: false, unread: activeChatId !== targetId });
            if (activeChatId === targetId) renderMessages(); else updateUI();
        }

        function renderMessages() {
            const c = document.getElementById('messages-container'); c.innerHTML = '';
            (chats[activeChatId] || []).forEach(m => {
                const isMe = m.isMe;
                const align = isMe ? 'justify-end' : 'justify-start';
                
                const bg = isMe ? 'bg-app-message-me text-white rounded-br-sm' : 'bg-app-message-other text-app-text rounded-bl-sm border border-app-border';
                const nameLabel = (!isMe && groups[activeChatId]) ? `<p class="text-[10px] font-bold mb-0.5 opacity-80" style="color: var(--app-accent)">${m.senderName}</p>` : '';
                
                let html = '';
                if(m.type === 'deleted') html = `<p class="text-sm italic opacity-60 flex items-center gap-1">🚫 Mensagem apagada</p>`;
                else if(m.type === 'text') html = `<p class="text-[15px] leading-relaxed break-words">${m.content}</p>`;
                else if(m.type === 'image') html = `<img src="${m.content}" class="rounded-lg w-64 max-w-full cursor-pointer hover:opacity-90 bg-white" onclick="window.open('${m.content}')">`;
                else if(m.type === 'audio') html = `<audio src="${m.content}" controls class="w-48 sm:w-64 max-w-full rounded-md shadow-sm"></audio>`;
                else if(m.type === 'location') html = `<a href="https://maps.google.com/?q=${m.content}" target="_blank" class="flex items-center gap-2 font-bold underline hover:opacity-80 py-1">📍 Ver no Mapa</a>`;
                
                const deleteEvt = isMe && m.type !== 'deleted' ? `ondblclick="requestDeleteMessage('${m.id}')" title="Duplo clique para apagar"` : '';

                c.innerHTML += `
                    <div class="flex w-full ${align} message-enter">
                        <div class="max-w-[80%] px-3 py-2 rounded-2xl ${bg} shadow-sm relative group" ${deleteEvt}>
                            ${nameLabel}${html}
                            <div class="text-[9px] mt-1 text-right opacity-60 flex justify-end items-center gap-1">
                                ${m.time} ${isMe ? '✓✓' : ''}
                            </div>
                        </div>
                    </div>`;
            });
            c.scrollTop = c.scrollHeight;
        }

        function requestDeleteMessage(msgId) {
            if(confirm("Deseja apagar esta mensagem para todos?")) {
                sendPayload('delete', msgId);
                const idx = chats[activeChatId].findIndex(m => m.id === msgId);
                if(idx > -1) { chats[activeChatId][idx].type = 'deleted'; chats[activeChatId][idx].content = ''; renderMessages(); updateUI(); }
            }
        }

        // NOVO NAVEGADOR (BING / GENÉRICO)
        function openBrowserModal() { document.getElementById('browser-modal').style.display = 'flex'; }
        function closeBrowserModal() { document.getElementById('browser-modal').style.display = 'none'; }
        function navigateBrowser() {
            let val = document.getElementById('browser-url-input').value.trim();
            if(!val) return;
            let url = val;
            if (!val.includes('.') || val.includes(' ')) url = 'https://www.bing.com/search?q=' + encodeURIComponent(val);
            else if (!val.startsWith('http')) url = 'https://' + val;
            document.getElementById('browser-frame').src = url;
        }

        function sendFile(input) {
            const f = input.files[0]; if(!f) return;
            if(f.size > 10*1024*1024) return alert('Máximo de 10MB por arquivo!');
            const r = new FileReader();
            r.onload = e => sendPayload(f.type.startsWith('image/')?'image':'file', e.target.result, {fileName: f.name});
            r.readAsDataURL(f); input.value = '';
        }

        function openGroupModal() {
            const listEl = document.getElementById('group-members-list'); listEl.innerHTML = '';
            if(users.size === 0) listEl.innerHTML = `<p class="text-xs text-center text-app-text-muted">Nenhum usuário online.</p>`;
            users.forEach(u => listEl.innerHTML += `<label class="flex items-center gap-2 p-2 hover:bg-app-input rounded cursor-pointer"><input type="checkbox" value="${u.id}" class="cb-member"><img src="${u.avatar}" class="w-6 h-6 rounded-full"><span class="text-sm">${u.name}</span></label>`);
            document.getElementById('group-modal').style.display = 'flex';
        }
        function createGroup() {
            const name = document.getElementById('group-name-input').value.trim(); if(!name) return;
            const members = Array.from(document.querySelectorAll('.cb-member:checked')).map(cb => cb.value); members.push(myProfile.id);
            const gId = 'g_' + Date.now();
            groups[gId] = { id: gId, name: name, members: members, avatar: `https://api.dicebear.com/7.x/identicon/svg?seed=${gId}` };
            client.subscribe(`${APP_TOPIC}/group/${gId}`);
            members.forEach(m => { if(m!==myProfile.id) client.publish(`${APP_TOPIC}/msg/${m}`, JSON.stringify({type:'group_invite', groupData:groups[gId]})); });
            document.getElementById('group-modal').style.display = 'none'; openChat(gId, true);
        }
    </script>
